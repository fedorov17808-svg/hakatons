version: '3.8'

services:
  # =================================================================
  # 1. API Gateway & Autonomous Keeper Service
  # =================================================================
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creditpulse-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DON_CLUSTER_MODE=production
      - DON_NODE_ALPHA_URL=http://validator-alpha:8011
      - DON_NODE_BETA_URL=http://validator-beta:8012
      - DON_NODE_GAMMA_URL=http://validator-gamma:8013
      - DON_MIN_QUORUM=2
      - KEEPER_ENABLED=true
    volumes:
      - ./backend/data:/app/data
    networks:
      - creditpulse-net
    depends_on:
      - validator-alpha
      - validator-beta
      - validator-gamma

  # =================================================================
  # 2. Decentralized Oracle Network (DON) Validator Nodes
  # =================================================================
  validator-alpha:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creditpulse-node-alpha
    restart: unless-stopped
    command: ["python3", "-m", "uvicorn", "nodes.node_server:app", "--host", "0.0.0.0", "--port", "8011"]
    ports:
      - "8011:8011"
    env_file:
      - ./backend/.env.node-alpha
    environment:
      - PORT=8011
      - NODE_ID=node-alpha
      - NODE_NAME=Oracle-Alpha
      - NODE_REGION=us-east-1
      - PRIMARY_DATA_SOURCE=defillama
      - CREDITPULSE_DEMO_KEYS=true
    networks:
      - creditpulse-net

  validator-beta:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creditpulse-node-beta
    restart: unless-stopped
    command: ["python3", "-m", "uvicorn", "nodes.node_server:app", "--host", "0.0.0.0", "--port", "8012"]
    ports:
      - "8012:8012"
    env_file:
      - ./backend/.env.node-beta
    environment:
      - PORT=8012
      - NODE_ID=node-beta
      - NODE_NAME=Oracle-Beta
      - NODE_REGION=eu-central-1
      - PRIMARY_DATA_SOURCE=dexscreener
      - CREDITPULSE_DEMO_KEYS=true
    networks:
      - creditpulse-net

  validator-gamma:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creditpulse-node-gamma
    restart: unless-stopped
    command: ["python3", "-m", "uvicorn", "nodes.node_server:app", "--host", "0.0.0.0", "--port", "8013"]
    ports:
      - "8013:8013"
    env_file:
      - ./backend/.env.node-gamma
    environment:
      - PORT=8013
      - NODE_ID=node-gamma
      - NODE_NAME=Oracle-Gamma
      - NODE_REGION=ap-southeast-1
      - PRIMARY_DATA_SOURCE=rpc
      - CREDITPULSE_DEMO_KEYS=true
    networks:
      - creditpulse-net

  # =================================================================
  # 3. Next.js 16 Production Frontend
  # =================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creditpulse-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:8000
      - NEXT_PUBLIC_CONTRACT_ADDRESS=0x5BEC88F55ECA9038A9f03E77052314EfDC293Da5
    networks:
      - creditpulse-net
    depends_on:
      - api-gateway

networks:
  creditpulse-net:
    driver: bridge
