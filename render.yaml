services:
  - type: web
    name: creditpulse-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PRIVATE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CONTRACT_ADDRESS
        value: "0x358925c5839a36bB2181786B8763Da0653B0f438"
      - key: RPC_URL
        value: "https://rpc.cc3-testnet.creditcoin.network"
      - key: PYTHON_VERSION
        value: "3.11.0"
